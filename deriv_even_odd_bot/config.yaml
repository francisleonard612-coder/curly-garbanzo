# Deriv Even/Odd engine configuration (spec Section 60).
# Every value here is overridable by environment variable -- see
# app/config/settings.py. No source edit is needed for ordinary changes.

mode: research          # research | demo | live  (env: TRADING_MODE)
currency: USD

symbols:
  - R_100
  - 1HZ100V

contract:
  duration: 1
  duration_unit: t      # Even/Odd settles on the next tick

gating:
  # --- HARD (these can veto; see app/execution/hard_gates.py) -------------
  # Minimum ticks before ANY trade is considered.
  min_samples: 2000
  # Expected value, in currency, that a quoted contract must clear. This is
  # the one economic condition that stays hard: Section 14 classifies a
  # candidate with no economically valid edge as INVALID, and no opportunity
  # score can make a negative-EV contract worth buying. Raising it above 0
  # demands a margin; lowering it below 0 means paying to place bets.
  min_expected_value: 0.0
  # Seconds a proposal may age before it is refused.
  max_proposal_age_seconds: 5.0

  # --- SOFT (these shape the opportunity score; none of them veto) --------
  # Score in [0,100] required to trade. Adaptive selectivity (Section 15) can
  # raise this by up to 60% when model health degrades. Nothing lowers it --
  # in particular, a long dry spell does not (Sections 15, 16).
  #
  # LOWERED, BY REQUEST, ALONGSIDE the floor-override removal in
  # app/evidence/opportunity.py's score() (see that comment for why the
  # override existed and what removing it changes). With the override gone,
  # score is a plain weighted blend again -- but the four economics
  # contributors still carry 58% of total weight, and measured edge on this
  # stream is consistently negative (see agreement_calibration.py's report;
  # edge has NEVER been observed positive across every session logged so
  # far, clustering narrowly around -0.01 to -0.03 depending on the
  # session's payout). That caps what any candidate can realistically score:
  # plugging real logged values (agreement 0.20 to 1.00, calibration quality
  # 0.5 to 0.99, realistic dispersion/health) through the actual scorer gave
  # a range of ~16-28/100, never higher, for one representative real
  # candidate (break_even 0.5303, edge -0.0274). 62 -- or even the old
  # borderline_threshold of 40 -- is unreachable by design at that ceiling;
  # this was true before this change too, just hidden behind the override
  # always capping the same candidates to ~5-10 first.
  #
  # 20.0 sits inside that measured ~16-28 range: below the better-quality
  # candidates observed, above the weaker ones, so it still discriminates
  # among what actually varies (agreement, calibration quality, dispersion,
  # model health) rather than admitting everything. Adaptive selectivity
  # still multiplies this up during unstable regimes (observed x1.35 in
  # DISTRIBUTION_SHIFT), so it naturally tightens further exactly when the
  # scorer's own regime_quality contributor already reads worse -- that
  # behavior is unchanged. Re-run the sensitivity check in the chat history
  # for this change (or app/diagnostics/shadow.py) before raising this
  # further; the 16-28 ceiling will drift with whatever break_even/edge this
  # account is actually seeing, not with this number.
  min_opportunity_score: 20.0
  # Score at or above which a candidate is STRONG rather than VALIDATED.
  # Lowered in proportion to min_opportunity_score above, same reasoning.
  strong_opportunity_score: 32.0
  # Below this a candidate is INVALID rather than BORDERLINE. Purely a
  # labelling boundary for diagnostics; both wait. Lowered in proportion to
  # min_opportunity_score above -- 40 was unreachable and made every
  # candidate INVALID regardless of relative quality.
  borderline_threshold: 12.0
  # Edge at which the edge contributor saturates at full marks. NOT a cutoff:
  # half this edge still scores 0.5 there.
  target_edge: 0.02

  # --- anti-deadlock diagnostics (Section 16) -----------------------------
  # After this much idle time AND this many idle ticks, the dashboard starts
  # reporting a rejection diagnosis. It does not change any threshold.
  idle_alert_seconds: 900.0
  idle_alert_ticks: 2000
  # Required edge over the break-even probability derived from the REAL
  # quoted payout, measured at the LOWER confidence bound (Section 26).
  min_edge: 0.02

  # Retained for the walk-forward simulator and older analysis scripts. The
  # live gate no longer reads these as cutoffs -- model agreement, interval
  # width, calibration quality and parity consistency are now weighted
  # contributors in app/evidence/opportunity.py (Sections 6, 13, 22).
  min_model_agreement: 0.60
  max_probability_uncertainty: 0.02
  min_calibration_quality: 0.50
  max_parity_inconsistency: 0.10

  # ADDED, EXPLICIT, USER-CHOSEN (see chat log / app/diagnostics/
  # agreement_calibration.py): a real hard gate, unlike min_model_agreement
  # above. Set to the [0.85-0.90) bucket floor -- the highest-agreement
  # segment with enough samples (n=4,632) to trust its numbers.
  #
  # WHAT THE DATA ACTUALLY SAYS ABOUT THIS BUCKET: hit_rate 49.9%, Wilson
  # 95% lower bound 0.485. Break-even for this payout is 0.5208. This
  # floor is BELOW break-even by design -- it was chosen anyway, as a
  # volume filter (cut every candidate below the best-observed segment)
  # rather than a claim that this segment is profitable. It is not. If
  # this comment still says that and the number below has been raised in
  # the hope that a higher bucket clears break-even, check
  # agreement_calibration.py's live report first -- as of the data behind
  # this comment, [0.95-1.00) actually did *worse* (49.5%-50.2%) than
  # [0.85-0.90), so higher is not a safe assumption without checking.
  min_agreement_fraction: 0.90

  # Family-wide alpha for the randomness battery. 0.01, not 0.05: the
  # battery runs continuously, so a loose alpha manufactures signal.
  randomness_alpha: 0.01

risk:
  # FIXED currency amount. Never a percentage of balance at this layer --
  # see the 527x incident documented in app/risk/staking.py.
  base_stake: 0.35
  max_stake: 6.0
  max_daily_loss: 25.0
  max_drawdown: 50.0
  max_consecutive_losses: 8
  # LOWERED FROM 200, alongside cooldown_seconds below: min_agreement_fraction
  # cuts WHICH candidates can trade, not HOW OFTEN one clears it. At known
  # negative expectancy (see min_agreement_fraction's comment above), volume
  # is the second lever -- fewer trades per day means a smaller expected
  # cumulative loss for the same per-trade edge. 20/day is a starting point,
  # not a derived number; tune it directly.
  max_trades_per_day: 2000
  max_concurrent_trades: 3
  # 300s = one trade at most every 5 minutes, same reasoning as
  # max_trades_per_day above. The two stack: whichever limit is hit first
  # stops that tick from trading.
  cooldown_seconds: 300.0
  stale_tick_seconds: 30.0

staking:
  # fixed | percentage | kelly | martingale
  #
  # MARTINGALE, ENABLED, AS REQUESTED: escalates the stake after 2
  # consecutive losses, for up to 3 escalation steps, then holds at the
  # step-3 stake (capped by max_stake below) until a win resets it to zero.
  #
  # THE MATH THIS DOES NOT CHANGE. This instrument's break-even accuracy is
  # 51.28% at a 1.95x payout (see the top of README.md); martingale does not
  # move that number. What it changes is the SHAPE of the outcome
  # distribution: frequent small recoveries, occasional large losses when a
  # streak outruns the 3-step ceiling. At negative expectancy that shape is
  # worse in expectation, not better -- it converts a slow bleed into a
  # sequence of small gains punctuated by sharp drawdowns. This is not a
  # reason the setting is unavailable; it is the fact to have in view while
  # choosing max_stake and max_daily_loss below, since martingale is what
  # makes those two numbers load-bearing rather than theoretical.
  method: martingale
  martingale_enabled: true
  # Trade placed immediately after the 2nd consecutive loss is the first
  # escalated one. Losses 1 and 2 stake at base_stake.
  martingale_trigger_losses: 2
  # stake at step n = base_stake * martingale_factor**n. 2.0 is classic
  # doubling -- at a 1.95x payout it recovers the prior stake and overshoots
  # into a small profit rather than exactly breaking even.
  martingale_factor: 2.1
  # Escalation stops here (still subject to max_stake) and HOLDS rather than
  # resetting -- a win is what resets the streak, not reaching this ceiling.
  # Keep this well below risk.max_consecutive_losses (the hard trading
  # stop), or the escalation ceiling and the hard stop engage together.
  martingale_max_steps: 6
  kelly_fraction: 0.25

storage:
  path: data/bot.db

logging:
  level: INFO
